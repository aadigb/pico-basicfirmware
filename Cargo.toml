[package]
name = "pico-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "blink"
test = false
bench = false

[dependencies]
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = { version = "0.5.1" }
embassy-usb = { version = "0.6.0" }
embassy-sync = { version = "0.8.0" }
embassy-futures = "0.1.2"
cyw43 = { version = "0.7.0" }
cyw43-pio = { version = "0.10.0" }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
critical-section = "1.1"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
heapless = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
incremental = false

[profile.dev]
opt-level = "s"
panic = "abort"